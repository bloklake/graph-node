# Factory registration: the Safe proxy factories, every proxy they create registered as a
# child, and the fifteen Safe events of those proxies. Insert-only.
specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Factory130
    network: mainnet
    source:
      address: "0xa6b71e26c5e0845f74c812102ca7114b6a896ab2"
      abi: ProxyFactory130
      startBlock: 24600000
      endBlock: 24630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Safe
      abis:
        - name: ProxyFactory130
          file: ../abis/ProxyFactory130.json
      eventHandlers:
        - event: ProxyCreation(address,address)
          handler: handleProxyCreation130
      file: ./src/factory.ts
  - kind: ethereum
    name: Factory130Eip155
    network: mainnet
    source:
      address: "0xc22834581ebc8527d974f8a1c97e1bea4ef910bc"
      abi: ProxyFactory130
      startBlock: 24600000
      endBlock: 24630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Safe
      abis:
        - name: ProxyFactory130
          file: ../abis/ProxyFactory130.json
      eventHandlers:
        - event: ProxyCreation(address,address)
          handler: handleProxyCreation130
      file: ./src/factory.ts
  - kind: ethereum
    name: Factory141
    network: mainnet
    source:
      address: "0x4e1dcf7ad4e460cfd30791ccc4f9c8a4f820ec67"
      abi: ProxyFactory141
      startBlock: 24600000
      endBlock: 24630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Safe
      abis:
        - name: ProxyFactory141
          file: ../abis/ProxyFactory141.json
      eventHandlers:
        - event: ProxyCreation(indexed address,address)
          handler: handleProxyCreation141
      file: ./src/factory.ts
  - kind: ethereum
    name: Factory150
    network: mainnet
    source:
      address: "0x14f2982d601c9458f93bd70b218933a6f8165e7b"
      abi: ProxyFactory141
      startBlock: 24600000
      endBlock: 24630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Safe
      abis:
        - name: ProxyFactory141
          file: ../abis/ProxyFactory141.json
      eventHandlers:
        - event: ProxyCreation(indexed address,address)
          handler: handleProxyCreation141
      file: ./src/factory.ts
templates:
  - kind: ethereum
    name: Safe
    network: mainnet
    source:
      abi: Safe
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - SafeSetup
        - SafeEvent
      abis:
        - name: Safe
          file: ../abis/Safe.json
      eventHandlers:
        - event: SafeSetup(indexed address,address[],uint256,address,address)
          handler: handleSafeSetup
        - event: SafeReceived(indexed address,uint256)
          handler: handleSafeReceived
        - event: SafeModuleTransaction(address,address,uint256,bytes,uint8)
          handler: handleSafeModuleTransaction
        - event: SafeMultiSigTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes,bytes)
          handler: handleSafeMultiSigTransaction
        - event: ExecutionSuccess(bytes32,uint256)
          handler: handleExecutionSuccess
        - event: ExecutionSuccess(indexed bytes32,uint256)
          handler: handleExecutionSuccessIndexed
        - event: ExecutionFailure(bytes32,uint256)
          handler: handleExecutionFailure
        - event: ExecutionFailure(indexed bytes32,uint256)
          handler: handleExecutionFailureIndexed
        - event: ChangedThreshold(uint256)
          handler: handleChangedThreshold
        - event: ChangedMasterCopy(address)
          handler: handleChangedMasterCopy
        - event: ChangedFallbackHandler(address)
          handler: handleChangedFallbackHandler
        - event: ChangedFallbackHandler(indexed address)
          handler: handleChangedFallbackHandlerIndexed
        - event: ChangedGuard(address)
          handler: handleChangedGuard
        - event: ChangedGuard(indexed address)
          handler: handleChangedGuardIndexed
        - event: ChangedModuleGuard(indexed address)
          handler: handleChangedModuleGuard
        - event: EnabledModule(address)
          handler: handleEnabledModule
        - event: EnabledModule(indexed address)
          handler: handleEnabledModuleIndexed
        - event: DisabledModule(address)
          handler: handleDisabledModule
        - event: DisabledModule(indexed address)
          handler: handleDisabledModuleIndexed
        - event: AddedOwner(address)
          handler: handleAddedOwner
        - event: AddedOwner(indexed address)
          handler: handleAddedOwnerIndexed
        - event: RemovedOwner(address)
          handler: handleRemovedOwner
        - event: RemovedOwner(indexed address)
          handler: handleRemovedOwnerIndexed
      file: ./src/safe.ts
